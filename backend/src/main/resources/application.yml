spring:
  application:
    name: tripsync-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripsync}
    username: ${SPRING_DATASOURCE_USERNAME:tripsync}
    password: ${SPRING_DATASOURCE_PASSWORD:tripsync_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:your-google-client-secret}
            scope: openid, profile, email

tripsync:
  jwt:
    secret: ${JWT_SECRET:replace-with-256-bit-base64-encoded-production-secret-key}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  google-maps:
    api-key: ${GOOGLE_MAPS_SERVER_API_KEY:}
  storage:
    s3-bucket: ${AWS_S3_BUCKET:tripsync-media}
    region: ${AWS_REGION:ap-south-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
